syntax = "proto3";

package access.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/Mars-08042/MarsChat/api/access/v1;v1";

// 一对一音视频通话的信令。媒体走 WebRTC 点对点，服务端只协调状态、转发 SDP 与 ICE，不解析内容。
//
// 流程：
//   1. 主叫发送 CallInvite，收到 CallAck（带 call_id）后开始等待；被叫的全部在线连接收到 CallIncoming；
//   2. 被叫任一连接发送 CallAccept，主叫收到 CallAccepted，被叫的其他连接收到 CallEnded（ANSWERED_ELSEWHERE）；
//      被叫也可以发送 CallReject 拒绝；
//   3. 主叫收到 CallAccepted 后创建 offer，用 CallSignal 发送；SDP 与 ICE 只在主叫连接和接听连接之间转发，
//      不回显给发送方；
//   4. 任何一方发送 CallHangup 结束通话，对方收到 CallEnded。
//
// 回复约定：
//   - 每个 CallRequest 都会收到带同一 request_id 的 CallAck 或 Error；
//   - Error 表示请求被拒绝，通话状态没有变化；
//   - CallAck 表示请求已被接受。之后通话如果因为对方离线、断线等原因结束，一律经 CallEnded 通知，
//     包括刚收到 CallAck 的连接自己。
//
// 限制：一个用户（包括全部设备）同一时间只能处于一通通话中，振铃中也算；只能呼叫好友。
// 振铃超时由服务端判定。主叫所在的服务实例崩溃时没有人发出 CallEnded，被叫客户端应在收到来电后
// 最多响铃 ring_timeout + 5 秒（ring_timeout 默认 60 秒），之后自行停止。

// CallRequest 是客户端发起的通话操作。
message CallRequest {
  oneof action {
    option (buf.validate.oneof).required = true;
    // 发起呼叫
    CallInvite invite = 1;
    // 接听，只有被叫在振铃中可以发送
    CallAccept accept = 2;
    // 拒绝，只有被叫在振铃中可以发送，被叫的任一设备拒绝都会结束这通通话
    CallReject reject = 3;
    // 挂断：主叫在任意时刻（振铃中即取消），或接听的那个连接在通话中
    CallHangup hangup = 4;
    // SDP 或 ICE，只能在接听之后由主叫连接或接听连接发送
    CallSignal signal = 5;
  }
}

// CallMedia 是通话类型，只用于展示；通话中切换音视频由客户端重新协商 SDP，服务端不感知。
enum CallMedia {
  CALL_MEDIA_UNSPECIFIED = 0;
  CALL_MEDIA_AUDIO = 1;
  CALL_MEDIA_VIDEO = 2;
}

message CallInvite {
  // 被叫用户 ID，不能是自己
  int64 callee_id = 1 [(buf.validate.field).int64.gt = 0];
  CallMedia media = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message CallAccept {
  int64 call_id = 1 [(buf.validate.field).int64.gt = 0];
}

message CallReject {
  int64 call_id = 1 [(buf.validate.field).int64.gt = 0];
}

message CallHangup {
  int64 call_id = 1 [(buf.validate.field).int64.gt = 0];
}

// CallSignal 是 WebRTC 协商数据。客户端上行与服务端转发使用同一个消息，服务端原样转发。
message CallSignal {
  int64 call_id = 1 [(buf.validate.field).int64.gt = 0];
  oneof payload {
    option (buf.validate.oneof).required = true;
    SessionDescription sdp = 2;
    IceCandidate ice_candidate = 3;
  }
}

// SdpType 对应 RTCSessionDescription.type 中需要经信令发送的两种。
enum SdpType {
  SDP_TYPE_UNSPECIFIED = 0;
  SDP_TYPE_OFFER = 1;
  SDP_TYPE_ANSWER = 2;
}

// SessionDescription 对应 RTCSessionDescriptionInit。
message SessionDescription {
  SdpType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string sdp = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 32768
  }];
}

// IceCandidate 对应 RTCIceCandidateInit。candidate 为空串表示候选收集结束。
message IceCandidate {
  string candidate = 1 [(buf.validate.field).string.max_bytes = 1024];
  string sdp_mid = 2 [(buf.validate.field).string.max_bytes = 64];
  optional uint32 sdp_mline_index = 3;
  string username_fragment = 4 [(buf.validate.field).string.max_bytes = 256];
}

// CallAck 表示请求已被接受。
message CallAck {
  int64 call_id = 1;
  // STUN/TURN 服务器，只在邀请和接听的 CallAck 中返回，客户端创建 RTCPeerConnection 时使用。
  // 服务端没有配置 TURN 时为空，客户端只用本机地址（同一台机器、同一局域网内可以直连）。
  // TURN 凭据是临时的，有效期由服务端配置（默认 12 小时），只用于这通通话
  repeated IceServer ice_servers = 2;
}

// IceServer 对应 RTCIceServer。
message IceServer {
  // 例如 turn:turn.example.com:3478?transport=udp
  repeated string urls = 1;
  // TURN REST API 约定的临时用户名：<过期时刻 Unix 秒>:<用户 ID>；STUN 为空
  string username = 2;
  // base64(HMAC-SHA1(共享密钥, username))；STUN 为空
  string credential = 3;
}

// CallEvent 是服务端主动推送的通话事件（request_id 为 0）。
message CallEvent {
  oneof event {
    // 来电，推给被叫的全部在线连接
    CallIncoming incoming = 1;
    // 对方已接听，推给主叫连接
    CallAccepted accepted = 2;
    // 通话结束
    CallEnded ended = 3;
    // 对方发来的 SDP 或 ICE
    CallSignal signal = 4;
  }
}

message CallIncoming {
  int64 call_id = 1;
  int64 caller_id = 2;
  CallMedia media = 3;
}

message CallAccepted {
  int64 call_id = 1;
}

// CallEndReason 是通话结束的原因。
enum CallEndReason {
  CALL_END_REASON_UNSPECIFIED = 0;
  // 对方挂断；振铃中为主叫取消
  CALL_END_REASON_HANGUP = 1;
  // 被叫拒绝，包括被叫在另一台设备上拒绝
  CALL_END_REASON_REJECTED = 2;
  // 振铃超时无人接听
  CALL_END_REASON_TIMEOUT = 3;
  // 被叫已在另一台设备上接听，只发给被叫的其他设备
  CALL_END_REASON_ANSWERED_ELSEWHERE = 4;
  // 对方连接断开或不可达。自己发出的信令无法送达对方时，自己也会收到这个原因
  CALL_END_REASON_DISCONNECTED = 5;
  // 邀请发出时被叫的连接都已失效，只发给主叫
  CALL_END_REASON_PEER_OFFLINE = 6;
}

message CallEnded {
  int64 call_id = 1;
  CallEndReason reason = 2;
}
