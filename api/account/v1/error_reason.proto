syntax = "proto3";

package account.v1;

option go_package = "github.com/Mars-08042/MarsChat/api/account/v1;v1";

// ErrorReason 是 account 服务的业务错误原因，原样作为 Kratos 错误的 reason 返回。
// 访问令牌缺失、无效、过期或已吊销时，reason 为 UNAUTHORIZED（由 pkg/auth 返回）；
// 请求参数不符合校验规则时，reason 为 VALIDATOR。
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // 429：同一手机号发送过于频繁
  SMS_SEND_TOO_FREQUENT = 1;
  // 429：同一手机号当天发送次数已达上限
  SMS_DAILY_LIMIT_EXCEEDED = 2;
  // 429：同一 IP 请求过于频繁
  RATE_LIMITED = 3;
  // 429：密码连续错误次数过多，暂时锁定
  LOGIN_LOCKED = 4;
  // 503：短信平台发送失败，可以立即重试（不占用发送间隔和每日次数）
  SMS_SEND_FAILED = 5;

  // 400：验证码错误或已过期
  SMS_CODE_INVALID = 10;
  // 400：验证码错误次数过多，已作废，需要重新获取
  SMS_CODE_ATTEMPTS_EXCEEDED = 11;
  // 400：密码必须同时包含字母和数字
  WEAK_PASSWORD = 12;

  // 401：手机号或密码错误
  INVALID_CREDENTIALS = 20;
  // 401：刷新令牌无效、过期或所属会话已失效，需要重新登录
  REFRESH_TOKEN_INVALID = 21;

  // 403：用户已被封禁
  USER_BANNED = 30;
  // 403：没有权限
  PERMISSION_DENIED = 31;

  // 404：用户不存在
  USER_NOT_FOUND = 40;
  // 404：会话不存在或不属于当前用户
  SESSION_NOT_FOUND = 41;

  // 409：手机号已注册
  PHONE_ALREADY_REGISTERED = 50;
  // 409：刷新令牌刚被另一个请求轮换（例如多个标签页同时刷新），应改用本地最新的令牌
  REFRESH_TOKEN_ROTATED = 51;
}
