                        application/json:
                            schema:
                                $ref: '#/components/schemas/social.v1.SetGroupMemberRoleResponse'
    /v1/groups/{groupId}/transfer:
        post:
            tags:
                - SocialService
            description: 转让群主（群主）。新群主必须是成员，原群主变为管理员。
            operationId: SocialService_TransferGroupOwner
            parameters:
                - name: groupId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/social.v1.TransferGroupOwnerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/social.v1.TransferGroupOwnerResponse'
    /v1/sessions:
        get:
            tags:
                - AccountService
            description: 列出自己当前有效的登录设备。
            operationId: AccountService_ListSessions
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/account.v1.ListSessionsResponse'
    /v1/sessions/{sessionId}:
        delete:
            tags:
                - AccountService
            description: 让自己的某个设备下线。
            operationId: AccountService_RevokeSession
            parameters:
                - name: sessionId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/account.v1.RevokeSessionResponse'
    /v1/users/me:
        get:
            tags:
                - AccountService
            description: 获取自己的完整资料。
            operationId: AccountService_GetMe
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/account.v1.GetMeResponse'
        patch:
            tags:
                - AccountService
            description: 修改自己的资料，只修改请求中出现的字段。
            operationId: AccountService_UpdateMe
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/account.v1.UpdateMeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/account.v1.UpdateMeResponse'
    /v1/users/{userId}:
        get:
            tags:
                - AccountService
            description: 获取其他用户的公开资料。
            operationId: AccountService_GetUser
            parameters:
                - name: userId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/account.v1.GetUserResponse'
