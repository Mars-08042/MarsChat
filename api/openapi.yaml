tags:
    - name: AccountService
      description: |-
        AccountService 是面向客户端的账号接口：经网关以 HTTP 暴露，也可以用 gRPC 调用。
         除发送验证码、注册、登录和刷新令牌外，都需要在 Authorization 头携带 Bearer 访问令牌。
    - name: MessageService
      description: |-
        MessageService 是面向客户端的会话与消息接口：经网关以 HTTP 暴露，也可以用 gRPC 调用。
         全部接口都需要在 Authorization 头携带 Bearer 访问令牌，当前用户取自令牌。
         发消息只走 WebSocket（见 access.v1 的帧协议），这里只有读取与已读。

         不是会话成员时一律返回 CONVERSATION_NOT_FOUND，不区分“会话不存在”和“无权访问”。
    - name: SocialService
      description: |-
        SocialService 是面向客户端的好友与群接口：经网关以 HTTP 暴露，也可以用 gRPC 调用。
         全部接口都需要在 Authorization 头携带 Bearer 访问令牌，当前用户取自令牌。

         列表接口都是游标分页：第一页 cursor 传 0，之后传上一页返回的 next_cursor；
         next_cursor 为 0 表示没有更多数据。limit 为 0 时取 20，最大 100。
         列表中的用户资料（profile）来自 account 服务，account 不可用时为空，客户端显示占位。
