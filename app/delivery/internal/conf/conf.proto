syntax = "proto3";

package marschat.delivery.conf;

import "buf/validate/validate.proto";
import "conf/conf.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/Mars-08042/MarsChat/app/delivery/internal/conf;conf";

message Bootstrap {
  // 只用 gRPC：没有业务接口，端口用于注册到 Consul 和健康检查
  marschat.conf.Server server = 1;
  marschat.conf.Registry registry = 2;
  marschat.conf.Redis redis = 3;
  marschat.conf.Log log = 4;
  marschat.conf.Kafka kafka = 5 [(buf.validate.field).required = true];
  // 群消息推送前取成员列表
  Upstream social = 6 [(buf.validate.field).required = true];
  Push push = 7 [(buf.validate.field).required = true];
}

// Upstream 是调用其他服务的配置，修改后需要重启。
message Upstream {
  // gRPC 地址，例如 discovery:///marschat-social 经 Consul 发现
  string endpoint = 1 [(buf.validate.field).string.min_len = 1];
  // 单次调用超时
  google.protobuf.Duration timeout = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {seconds: 0}
  ];
}

// Push 是调用 access 的配置。access 实例按在线路由中的地址直连，不经 Consul。
message Push {
  // 单次 Push、Kick 调用的超时
  google.protobuf.Duration timeout = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {seconds: 0}
  ];
}
