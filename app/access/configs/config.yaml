# access 服务配置。${XXX} 引用环境变量 MARSCHAT_XXX，${XXX:默认值} 在变量缺失时取默认值。
# 默认值对应本地开发环境（compose.yaml），密码只从环境变量读取。
# 时长按 protobuf Duration 的 JSON 格式书写，单位只能是秒，例如 0.5s、3600s；500ms、1h 会解析失败。
server:
  # 只提供 WebSocket（GET /ws）和健康检查；timeout 对 WebSocket 连接不起作用
  http:
    addr: ${ACCESS_HTTP_ADDR:127.0.0.1:18000}
    timeout: 3s
  grpc:
    addr: ${ACCESS_GRPC_ADDR:127.0.0.1:19100}
    timeout: 3s

# 本实例 gRPC 地址，写入在线路由供 delivery 直连；容器或多机部署时设为本机可被访问的 IP
advertise_addr: ${ACCESS_ADVERTISE_ADDR:127.0.0.1:19100}

registry:
  consul:
    address: ${CONSUL_ADDR:127.0.0.1:18500}
    health_check: false

redis:
  addr: ${REDIS_ADDR:127.0.0.1:16379}
  password: ${REDIS_PASSWORD}
  db: 0
  dial_timeout: 2s
  read_timeout: 0.5s
  write_timeout: 0.5s

log:
  level: ${LOG_LEVEL:info}
  format: ${LOG_FORMAT:text}

# 访问令牌校验（各服务相同）
auth:
  public_key: ${JWT_PUBLIC_KEY}
  issuer: marschat-account
  audience: marschat

message:
  endpoint: ${MESSAGE_ENDPOINT:discovery:///marschat-message}
  timeout: 3s

websocket:
  auth_timeout: 10s
  heartbeat_interval: 30s
  heartbeat_timeout: 90s
  send_queue: 256
  write_timeout: 10s
  max_frame_bytes: 65536

# 限额策略：修改后自动热更新，无需重启；校验不通过时保留旧值并记录错误日志
policy:
  frames_per_second: 30
