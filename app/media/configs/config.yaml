# media 服务配置。${XXX} 引用环境变量 MARSCHAT_XXX，${XXX:默认值} 在变量缺失时取默认值。
# 默认值对应本地开发环境（compose.yaml），密码和密钥只从环境变量读取。
# 时长按 protobuf Duration 的 JSON 格式书写，单位只能是秒，例如 0.5s、3600s；500ms、1h 会解析失败。
server:
  http:
    addr: ${MEDIA_HTTP_ADDR:127.0.0.1:18050}
    # Kratos 对所有 HTTP 路由使用同一个超时，要覆盖 100 MB 文件在慢速网络下的上传；其他接口都很快
    timeout: 300s
  grpc:
    addr: ${MEDIA_GRPC_ADDR:127.0.0.1:19050}
    timeout: 3s

registry:
  consul:
    address: ${CONSUL_ADDR:127.0.0.1:18500}
    tcp_check_interval: ${CONSUL_TCP_CHECK_INTERVAL:0s}

mysql:
  dsn: media:${MEDIA_DB_PASSWORD}@tcp(${MYSQL_ADDR:127.0.0.1:13306})/marschat_media?charset=utf8mb4&parseTime=true&loc=UTC&timeout=5s
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 3600s
  slow_threshold: 0.2s

redis:
  addr: ${REDIS_ADDR:127.0.0.1:16379}
  password: ${REDIS_PASSWORD}
  db: 0
  dial_timeout: 2s
  read_timeout: 0.5s
  write_timeout: 0.5s

log:
  level: ${LOG_LEVEL:info}
  format: ${LOG_FORMAT:text}

# 访问令牌校验（各服务相同）
auth:
  public_key: ${JWT_PUBLIC_KEY}
  issuer: marschat-account
  audience: marschat

# 文件存储，修改后需要重启；切换后端不迁移已有文件。见 docs/deployment.md 的“文件存储”。
storage:
  # local：仓库下的本地目录（默认）；oss：阿里云 OSS
  provider: ${STORAGE_PROVIDER:local}
  local:
    # 相对路径相对于工作目录：make run-media 在仓库根目录运行，即仓库下的 data/media（被 Git 忽略）
    dir: ${MEDIA_LOCAL_DIR:data/media}
    # 下载地址的前缀：宿主机模式直连 media；容器模式经网关（compose.yaml 中覆盖）
    public_base_url: ${MEDIA_PUBLIC_BASE_URL:http://127.0.0.1:18050}
    # 下载地址的签名密钥，make keys 生成
    url_secret: ${MEDIA_URL_SECRET:}
  oss:
    # 地域，例如 cn-hangzhou
    region: ${OSS_REGION:}
    # 为空时按地域使用公网地址；部署在同地域 ECS 时可填内网地址
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    # 只授权该 Bucket 读写的 RAM 用户 AccessKey
    access_key_id: ${OSS_ACCESS_KEY_ID:}
    access_key_secret: ${OSS_ACCESS_KEY_SECRET:}
    # 对象名前缀。对象名为 {key_prefix}files/2026/11/{文件 ID}，年、月取自文件 ID 中的生成时间（UTC）
    key_prefix: ${OSS_KEY_PREFIX:marschat/}
    # 已绑定到 Bucket 的自定义域名（例如 https://files.example.com），为空时用 Bucket 默认域名
    public_endpoint: ${OSS_PUBLIC_ENDPOINT:}

cache:
  file_ttl: 1800s
  null_ttl: 60s

# 上传限制与下载地址参数：修改后自动热更新，无需重启；校验不通过时保留旧值并记录错误日志
policy:
  # 100 MiB
  max_chat_file_bytes: 104857600
  # 10 MiB：不超过它的 JPEG、PNG、GIF、WebP 解码并生成缩略图，更大的按普通文件保存
  max_image_bytes: 10485760
  # 5 MiB
  max_avatar_bytes: 5242880
  max_image_pixels: 16000000
  thumbnail_max_side: 320
  download_url_ttl: 600s
  upload_limit:
    limit: 60
    window: 3600s

# 指标与链路追踪，修改后需要重启。指标始终在 HTTP 端口的 /metrics 上暴露（Prometheus 抓取）；
# Trace 只在设置了 OTLP 地址时导出，容器模式下为 jaeger:4317，宿主机运行时可设为 127.0.0.1:14317。
telemetry:
  otlp_endpoint: ${OTLP_ENDPOINT:}
  # 采样比例 0～1；上游已采样的请求跟随上游的决定。压测时调低，避免 Jaeger 内存上涨
  sample_ratio: ${TRACE_SAMPLE_RATIO:1}
