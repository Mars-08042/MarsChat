[mainConfig]
appName = "marschat"
host = "127.0.0.1"
port = 8000
tlsCertFile = "../../pkg/ssl/local.pem"
tlsKeyFile = "../../pkg/ssl/local-key.pem"

[mysqlConfig]
host = "127.0.0.1"
port = 13307
user = "marschat"
password = "replace-with-local-password"
databaseName = "marschat"

[redisConfig]
host = "127.0.0.1"
port = 16381
password = ""
db = 0

[authCodeConfig]
accessKeyID = "your accessKeyID in alibaba cloud"
accessKeySecret = "your accessKeySecret in alibaba cloud"
signName = "阿里云短信测试"
templateCode = "SMS_154950909"

[logConfig]
logPath = "./logs/backend.log"

[kafkaConfig]
messageMode = "channel"# 消息模式 channel or kafka
hostPort = "127.0.0.1:19093"
loginTopic = "login"
chatTopic = "chat_message"
logoutTopic = "logout"
partition = 0 # kafka partition
timeout = 1 # 单位秒

[staticSrcConfig]
staticAvatarPath = "../../static/avatars"
staticFilePath = "../../static/files"
