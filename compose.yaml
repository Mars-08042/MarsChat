# MarsChat 本地依赖组件。宿主机端口 = 容器默认端口 + 10000，只绑定 127.0.0.1。
# 密码从 .env 读取（模板见 .env.example）。应用服务在开发阶段运行在宿主机上。
name: marschat

services:
  mysql:
    image: mysql:9.7.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARSCHAT_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MARSCHAT_MYSQL_ROOT_PASSWORD}
      # 供初始化脚本为各服务建库建账号
      MARSCHAT_ACCOUNT_DB_PASSWORD: ${MARSCHAT_ACCOUNT_DB_PASSWORD:?请在 .env 中设置 MARSCHAT_ACCOUNT_DB_PASSWORD}
      MARSCHAT_SOCIAL_DB_PASSWORD: ${MARSCHAT_SOCIAL_DB_PASSWORD:?请在 .env 中设置 MARSCHAT_SOCIAL_DB_PASSWORD}
      MARSCHAT_MESSAGE_DB_PASSWORD: ${MARSCHAT_MESSAGE_DB_PASSWORD:?请在 .env 中设置 MARSCHAT_MESSAGE_DB_PASSWORD}
      MARSCHAT_MEDIA_DB_PASSWORD: ${MARSCHAT_MEDIA_DB_PASSWORD:?请在 .env 中设置 MARSCHAT_MEDIA_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    environment:
      REDIS_PASSWORD: ${MARSCHAT_REDIS_PASSWORD:?请在 .env 中设置 MARSCHAT_REDIS_PASSWORD}
    # 自定义命令后不再加载镜像默认配置中的模块，RedisBloom（用户 ID 布隆过滤器）需要显式加载
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --loadmodule /usr/local/lib/redis/modules/redisbloom.so"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      CLUSTER_ID: bWFyc2NoYXQta2Fma2EtMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # EXTERNAL 供宿主机上的服务访问，INTERNAL 供容器网络内访问
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:19092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topic 由初始化任务显式创建，避免拼写错误时被静默自动创建
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  consul:
    image: hashicorp/consul:2.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:18500:8500"
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0", "-data-dir=/consul/data"]
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 数据库迁移任务，带 profile 所以 make up 不会启动，由 make migrate-<服务> 按需运行
  migrate-account:
    image: migrate/migrate:v4.20.1
    profiles: ["migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${MARSCHAT_ACCOUNT_DB_PASSWORD:?请在 .env 中设置 MARSCHAT_ACCOUNT_DB_PASSWORD}
    volumes:
      - ./app/account/migrations:/migrations:ro
    # 密码从环境变量展开，不写进 compose 文件；"$$@" 接收 docker compose run 传入的子命令（up、down 1 等）
    entrypoint: ["sh", "-c", "exec migrate -path /migrations -database \"mysql://account:$${DB_PASSWORD}@tcp(mysql:3306)/marschat_account?multiStatements=true\" \"$$@\"", "migrate"]
    command: ["up"]

  migrate-social:
    image: migrate/migrate:v4.20.1
    profiles: ["migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${MARSCHAT_SOCIAL_DB_PASSWORD:?请在 .env 中设置 MARSCHAT_SOCIAL_DB_PASSWORD}
    volumes:
      - ./app/social/migrations:/migrations:ro
    entrypoint: ["sh", "-c", "exec migrate -path /migrations -database \"mysql://social:$${DB_PASSWORD}@tcp(mysql:3306)/marschat_social?multiStatements=true\" \"$$@\"", "migrate"]
    command: ["up"]

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  consul-data:
