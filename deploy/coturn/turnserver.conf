# coturn 的固定配置（docs/design/turn-relay.md），Compose 的 coturn 服务（profile call）挂载。
# 随部署环境变化的参数由 compose.yaml 的启动参数传入，不写在这里：
#   --static-auth-secret  与 access 共用的密钥（.env 的 MARSCHAT_TURN_SECRET，make keys 生成）
#   --external-ip         客户端访问 coturn 用的地址与容器地址的映射
#   --allowed-peer-ip     对外地址本身，见下面 denied-peer-ip 的说明

listening-port=3478
# 中继端口只开一小段：Docker 按端口逐个转发，大段 UDP 端口映射启动很慢。每个中继分配占一个端口，
# 一通全程中继的通话两端各占一个，这里够 20 通左右；公网部署时按并发通话数放大（同时改 compose.yaml）
min-port=49160
max-port=49200

# TURN REST API：用户名是「过期时刻:用户 ID」，密码是 base64(HMAC-SHA1(密钥, 用户名))，由 access 签发
use-auth-secret
realm=marschat
fingerprint
# 没有证书，不开 TLS 监听（TURN over TLS 随公网部署配置证书后再开）
no-tls

# 防滥用：TURN 能把流量转发到任意地址，禁止转发到内网与本机，否则可以被用来访问服务器所在的网络。
# 回环地址 coturn 默认就禁止。两端都走中继时，对端地址是 coturn 自己的对外地址（本机或局域网地址），
# 由启动参数 --allowed-peer-ip 单独放行这一个地址
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# 每个用户（同一个临时用户名）的并发分配上限。浏览器对每个 TURN 地址（udp、tcp 各一个）、在每块本机网卡上
# 各申请一次分配，装了 VPN 或虚拟网卡的电脑一通通话就能用到 6～8 个；设成 4 时 coturn 自带的测试工具都会收到
# 486（Allocation Quota Reached），见计划的「遇到的问题」。全局上限在本地实际受中继端口数（41 个）限制
user-quota=10
total-quota=200

# 日志输出到标准输出，由 docker logs 查看；以 nobody 运行，pid 文件放到可写的 /tmp
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
