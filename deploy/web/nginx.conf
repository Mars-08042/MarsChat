# 前端静态文件（docs/design/web-deployment.md）。只由网关访问：/v1、/ws 由网关的其他路由转给服务，
# 剩下的路径才到这里。文件位于 http 块内（镜像的 nginx.conf 引入 conf.d/*.conf）。

# 带哈希的 assets 内容不变，缓存一年；其他文件（index.html、表情数据与图片）每次向服务器确认，
# 发布新版本后刷新即生效。用 map 在 server 级统一设置：location 里一旦写 add_header，
# 就不再继承 server 级的 add_header，安全头会丢
map $uri $marschat_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 不加 always：只给 200、304 等成功响应加缓存头，缺失文件的 404 不能被缓存一年
  add_header Cache-Control $marschat_cache_control;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # 不存在的代码文件返回 404，不能回落成 index.html：否则浏览器把 HTML 当脚本执行报错，
  # 前端的「页面加载失败」提示也拿不到明确的失败
  location /assets/ {
    try_files $uri =404;
  }

  # 走到这里说明接口路径不存在，返回 404 而不是 index.html 的 200，否则接口调用方会把 HTML 当成响应
  location ^~ /v1/ {
    return 404;
  }
  location = /ws {
    return 404;
  }

  # 前端路由（/chat/...、/settings/... 等）刷新时返回 index.html
  location / {
    try_files $uri /index.html;
  }
}
