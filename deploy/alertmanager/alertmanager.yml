# Alertmanager 配置（compose profile monitoring）。不对外发送通知：告警在 Alertmanager 界面
# （127.0.0.1:19093）和 Grafana 中查看。以后接入邮件或 IM 时在 receivers 中加配置（属于对外动作，需单独确认）。
route:
  receiver: none
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  # 没有任何通知配置的接收方，只用于在界面中展示
  - name: none
