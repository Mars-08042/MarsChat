# Jaeger v2 配置（compose profile monitoring），由镜像默认的 all-in-one 配置裁剪而来（v2.23.0
# cmd/jaeger/internal/all-in-one.yaml）：只接收 OTLP，内存存储，提供查询界面与健康检查。
# 去掉了 Jaeger、Zipkin 接收器、远程采样、expvar、zpages 和 AI 工具，节省内存。重启后 Trace 丢失。
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    # 不暴露 Jaeger 自身的指标
    metrics:
      level: none
    logs:
      level: info

extensions:
  jaeger_query:
    storage:
      traces: memory_store
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      memory_store:
        memory:
          # 默认 100000；压测时调低采样比例，2 万条 Trace 足够开发与排查用
          max_traces: 20000

  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store
