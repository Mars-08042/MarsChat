syntax = "proto3";

// 各服务共用的配置片段。服务自己的 Bootstrap 定义在 app/<服务>/internal/conf/conf.proto，
// 按需组合这里的消息。
package marschat.conf;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/Mars-08042/MarsChat/pkg/conf;conf";

message Server {
  message HTTP {
    string addr = 1;
    google.protobuf.Duration timeout = 2;
  }
  message GRPC {
    string addr = 1;
    google.protobuf.Duration timeout = 2;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Registry {
  message Consul {
    string address = 1;
    // 原来的 bool health_check。布尔值无法用 ${XXX:默认值} 占位符覆盖（替换结果是字符串，
    // protojson 不接受），改为下面的时长字段。
    reserved 2;
    reserved "health_check";
    // Consul 主动 TCP 探测服务端口的间隔，同时是 TTL 心跳的间隔（超时为 2 倍），只取整秒。
    // 0 表示不做 TCP 探测、只保留 TTL 心跳（间隔为 Kratos 默认的 10 秒）：本地开发时服务监听宿主机
    // 127.0.0.1，容器里的 Consul 探测不到。容器模式下设为 3 秒，实例被杀后几秒内从发现结果中消失。
    google.protobuf.Duration tcp_check_interval = 3 [(buf.validate.field).cel = {
      id: "registry.consul.tcp_check_interval"
      message: "must be 0 or between 1s and 60s"
      expression: "this == duration('0s') || (this >= duration('1s') && this <= duration('60s'))"
    }];
  }
  Consul consul = 1;
}

message MySQL {
  string dsn = 1;
  int32 max_open_conns = 2;
  int32 max_idle_conns = 3;
  google.protobuf.Duration conn_max_lifetime = 4;
  // 超过该耗时的 SQL 记一条 warn 日志
  google.protobuf.Duration slow_threshold = 5;
}

message Redis {
  string addr = 1;
  string password = 2;
  int32 db = 3;
  google.protobuf.Duration dial_timeout = 4;
  google.protobuf.Duration read_timeout = 5;
  google.protobuf.Duration write_timeout = 6;
}

message Log {
  // debug、info、warn、error
  string level = 1;
  // text 或 json
  string format = 2;
}

// Auth 是校验访问令牌所需的配置，各服务共用。签发令牌的私钥只在 account 中配置。
message Auth {
  // Ed25519 公钥（32 字节）的 base64 标准编码
  string public_key = 1 [(buf.validate.field).string.min_len = 1];
  string issuer = 2 [(buf.validate.field).string.min_len = 1];
  string audience = 3 [(buf.validate.field).string.min_len = 1];
}

// RateLimit 表示滑动窗口限流：window 时间内最多 limit 次。
message RateLimit {
  int32 limit = 1 [(buf.validate.field).int32.gt = 0];
  google.protobuf.Duration window = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {seconds: 0}
  ];
}

// Kafka 是 Kafka 客户端配置，修改后需要重启。
message Kafka {
  // broker 地址，多个用逗号分隔
  string brokers = 1 [(buf.validate.field).string.min_len = 1];
  // 消费组会话超时：实例被杀后，要等这么久它的分区才会转给其他实例。不填时为 franz-go 默认的 45 秒。
  // 太短会让 GC 停顿、网络抖动触发不必要的再平衡；下限是 broker 的 group.min.session.timeout.ms（默认 6 秒）。
  google.protobuf.Duration session_timeout = 2 [(buf.validate.field).duration = {
    gte: {seconds: 6}
    lte: {seconds: 300}
  }];
}

// Telemetry 是指标与链路追踪配置，修改后需要重启。指标始终在 HTTP 端口的 /metrics 上暴露，不受这里控制。
message Telemetry {
  // OTLP gRPC 地址，例如 jaeger:4317；为空时不导出 Trace（Span 上下文照常向下游传播）
  string otlp_endpoint = 1;
  // Trace 采样比例，0～1，不填时为 1。上游已经采样的请求跟随上游的决定
  optional double sample_ratio = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// Outbox 是 Outbox 发布器配置，修改后需要重启。
message Outbox {
  // 没有收到进程内唤醒时的轮询间隔
  google.protobuf.Duration poll_interval = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {seconds: 0}
  ];
  // 每批最多发布的事件数
  int32 batch_size = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 1000
  }];
  // 已发布事件的保留时间，超过后删除
  google.protobuf.Duration retention = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {seconds: 0}
  ];
}
