<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<title id="title">MarsChat 目标架构：React、Kratos、Consul 与 Apache APISIX</title><desc id="desc">提议中的目标架构，尚未实施。聊天客户端与管理界面拟重构为 React + TypeScript + Vite + pnpm。浏览器经 Apache APISIX 进入系统：WebSocket 连接转发到只承载长连接的接入服务 access，HTTP 接口按路径直达账户、社交、文件和消息等 Kratos 业务服务，令牌由 Kratos 中间件校验。APISIX 使用 Standalone 文件配置并从 Consul 发现上游；Kratos 服务通过 Consul 注册与发现。access 在握手时校验令牌，在 Redis 登记用户、设备与实例的在线路由，并按路由把通话信令直接转给对端 access。消息服务按会话存储消息（读扩散）并分配会话内序号，消息与待发布事件同事务落库，经 Kafka 异步分发；投递服务消费事件后查询在线路由，定向推送到目标 access 实例。实时推送尽力而为，客户端断线后比对游标按序号补拉。WebRTC 媒体由浏览器直连或经 coturn 中继。</desc>
