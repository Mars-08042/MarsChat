<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="758" font-family="Noto Sans CJK SC, Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" viewBox="0 0 760 758" role="img" aria-label="一条聊天消息先写入 MySQL，再推送给在线接收方并回显给发送方" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="mf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b2a9"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1c">一条聊天消息先写入 MySQL，再推送给在线接收方并回显给发送方</text>
<text x="24" y="50" font-size="11.5" fill="#6b6964">两种 messageMode 只在第 ③ 步不同；④～⑦ 的逻辑在 server.go 与 kafka_server.go 中各有一份</text>

<g>
<rect x="200" y="72" width="360" height="52" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="380" y="94" text-anchor="middle" font-weight="600" fill="#1f1e1c">① 发送方浏览器</text>
<text x="380" y="112" text-anchor="middle" font-size="11.5" fill="#1f1e1c">socket.send(JSON)：type 0 文本 / 2 文件 / 3 通话</text>
</g>
<g>
<rect x="200" y="164" width="360" height="52" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="380" y="186" text-anchor="middle" font-weight="600" fill="#1f1e1c">② Client.Read 协程</text>
<text x="380" y="204" text-anchor="middle" font-size="11.5" fill="#1f1e1c">读取 WebSocket 帧，按 messageMode 分流</text>
</g>
<g>
<rect x="40" y="256" width="320" height="66" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="200" y="278" text-anchor="middle" font-weight="600" fill="#1f1e1c">③a channel 模式（默认）</text>
<text x="200" y="296" text-anchor="middle" font-size="11.5" fill="#1f1e1c">写入 ChatServer.Transmit（容量 100）</text>
<text x="200" y="312" text-anchor="middle" font-size="11.5" fill="#1f1e1c">满则暂存 Client.SendTo，再满回提示文本</text>
</g>
<g>
<rect x="400" y="256" width="320" height="66" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="560" y="278" text-anchor="middle" font-weight="600" fill="#1f1e1c">③b kafka 模式</text>
<text x="560" y="296" text-anchor="middle" font-size="11.5" fill="#1f1e1c">写入 topic chat_message</text>
<text x="560" y="312" text-anchor="middle" font-size="11.5" fill="#1f1e1c">KafkaChatServer 以消费组 chat 读取</text>
</g>
<g>
<rect x="200" y="362" width="360" height="68" rx="8" fill="#2c6fd1" fill-opacity="0.12" stroke="#2c6fd1" stroke-width="2"/>
<text x="380" y="384" text-anchor="middle" font-weight="600" fill="#1f1e1c">④ 转发循环（单协程串行处理）</text>
<text x="380" y="402" text-anchor="middle" font-size="11.5" fill="#1f1e1c">按 type 分派；文本与文件写入 message 表（status=0）</text>
<text x="380" y="418" text-anchor="middle" font-size="11.5" fill="#1f1e1c">通话消息仅 start_call / receive_call / reject_call 落库</text>
</g>
<g>
<rect x="200" y="470" width="360" height="66" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="380" y="492" text-anchor="middle" font-weight="600" fill="#1f1e1c">⑤ 确定接收方</text>
<text x="380" y="510" text-anchor="middle" font-size="11.5" fill="#1f1e1c">receive_id 以 U 开头：单个用户</text>
<text x="380" y="526" text-anchor="middle" font-size="11.5" fill="#1f1e1c">以 G 开头：读取 group_info.members 全部成员</text>
</g>
<g>
<rect x="200" y="576" width="360" height="66" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="380" y="598" text-anchor="middle" font-weight="600" fill="#1f1e1c">⑥ 推送到在线连接</text>
<text x="380" y="616" text-anchor="middle" font-size="11.5" fill="#1f1e1c">写入在线接收方与发送方的 SendBack 通道（回显）</text>
<text x="380" y="632" text-anchor="middle" font-size="11.5" fill="#1f1e1c">通话消息只发给对方、不回显；群聊通话不转发</text>
</g>
<g>
<rect x="200" y="682" width="360" height="52" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="380" y="704" text-anchor="middle" font-weight="600" fill="#1f1e1c">⑦ Client.Write 协程</text>
<text x="380" y="722" text-anchor="middle" font-size="11.5" fill="#1f1e1c">写出 WebSocket 成功后将该消息 status 改为 1</text>
</g>

<g>
<rect x="24" y="576" width="152" height="92" rx="8" fill="#ecebe6" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="36" y="597" font-size="11.5" font-weight="600" fill="#1f1e1c">Redis 消息缓存</text>
<text x="36" y="615" font-size="11.5" fill="#1f1e1c">已有缓存键时追加；</text>
<text x="36" y="633" font-size="11.5" fill="#1f1e1c">该键当前没有写入</text>
<text x="36" y="651" font-size="11.5" fill="#1f1e1c">入口，分支不会触发</text>
</g>
<g>
<rect x="584" y="576" width="152" height="92" rx="8" fill="#ecebe6" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="596" y="597" font-size="11.5" font-weight="600" fill="#1f1e1c">接收方离线时</text>
<text x="596" y="615" font-size="11.5" fill="#1f1e1c">只落库、不推送；</text>
<text x="596" y="633" font-size="11.5" fill="#1f1e1c">打开会话时调用</text>
<text x="596" y="651" font-size="11.5" fill="#1f1e1c">getMessageList 读库</text>
</g>

<g fill="none" stroke="#b4b2a9" stroke-width="1.25">
<path d="M380 124V162" marker-end="url(#mf-arrow)"/>
<path d="M300 216V236H200V254" marker-end="url(#mf-arrow)"/>
<path d="M460 216V236H560V254" marker-end="url(#mf-arrow)"/>
<path d="M200 322V342H300V360" marker-end="url(#mf-arrow)"/>
<path d="M560 322V342H460V360" marker-end="url(#mf-arrow)"/>
<path d="M380 430V468" marker-end="url(#mf-arrow)"/>
<path d="M380 536V574" marker-end="url(#mf-arrow)"/>
<path d="M380 642V680" marker-end="url(#mf-arrow)"/>
</g>
<g fill="none" stroke="#b4b2a9" stroke-width="1.25" stroke-dasharray="5 4">
<path d="M200 609H178" marker-end="url(#mf-arrow)"/>
<path d="M560 609H582" marker-end="url(#mf-arrow)"/>
</g>
</svg>
