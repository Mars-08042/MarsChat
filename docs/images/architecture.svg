<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="604" font-family="Noto Sans CJK SC, Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" viewBox="0 0 760 604" role="img" aria-label="浏览器经 HTTPS 与 WSS 访问同一个 Go 进程，音视频媒体流在浏览器之间直连" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b2a9"/></marker></defs>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1c">浏览器经 HTTPS 与 WSS 访问同一个 Go 进程，音视频媒体流在浏览器之间直连</text>
<text x="24" y="50" font-size="11.5" fill="#6b6964">当前为单实例部署：在线连接表保存在进程内存中；Kafka 仅在 messageMode=kafka 时启用</text>

<g>
<rect x="24" y="68" width="712" height="96" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="40" y="90" font-weight="600" fill="#6b6964">浏览器（Vue 3 单页应用）</text>
</g>
<g>
<rect x="40" y="102" width="240" height="48" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
