<text x="40" y="226" font-weight="600" fill="#1f1e1c">Go 后端进程（单实例）</text>
</g>
<g>
<rect x="40" y="238" width="332" height="56" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="206" y="261" text-anchor="middle" font-weight="600" fill="#1f1e1c">Gin 路由 api/v1</text>
<text x="206" y="279" text-anchor="middle" font-size="11.5" fill="#1f1e1c">47 个 POST 接口 · CORS · 静态文件 /static/*</text>
</g>
<g>
<rect x="388" y="238" width="332" height="56" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="554" y="261" text-anchor="middle" font-weight="600" fill="#1f1e1c">WebSocket 接入 GET /wss</text>
<text x="554" y="279" text-anchor="middle" font-size="11.5" fill="#1f1e1c">client_id 标识用户 · 每连接两个读写协程</text>
</g>
<g>
<rect x="40" y="332" width="332" height="64" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="206" y="357" text-anchor="middle" font-weight="600" fill="#1f1e1c">业务服务 internal/service/gorm</text>
<text x="206" y="376" text-anchor="middle" font-size="11.5" fill="#1f1e1c">用户 · 联系人 · 群组 · 会话 · 消息与文件</text>
</g>
<g>
<rect x="388" y="332" width="332" height="64" rx="8" fill="#ffffff" stroke="#b4b2a9" stroke-width="1.25"/>
