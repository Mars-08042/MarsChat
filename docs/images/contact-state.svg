<g font-size="11.5" fill="#6b6964">
<text x="202" y="138">发起申请</text>
<text x="100" y="224">同意</text>
<text x="178" y="254" text-anchor="end">拒绝</text>
<text x="210" y="254">再次申请</text>
<text x="240" y="224">拉黑申请</text>
</g>
