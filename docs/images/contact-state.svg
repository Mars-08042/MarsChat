<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" font-family="Noto Sans CJK SC, Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" viewBox="0 0 760 432" role="img" aria-label="申请记录与联系关系各自维护状态，删除与退群同时做软删除" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
