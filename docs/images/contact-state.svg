<text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1c">申请记录与联系关系各自维护状态，删除与退群同时做软删除</text>
<text x="24" y="50" font-size="11.5" fill="#6b6964">状态值以 pkg/enum 为准；model 注释里 1～4 的含义与枚举相反，以枚举和实际写入逻辑为准</text>

<g>
