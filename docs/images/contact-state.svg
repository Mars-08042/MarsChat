<rect x="40" y="330" width="308" height="66" rx="8" fill="#ecebe6" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="52" y="350" font-size="11.5" fill="#1f1e1c">好友申请被拉黑后，再次申请直接失败</text>
<text x="52" y="367" font-size="11.5" fill="#1f1e1c">加群申请再次提交不会重置为申请中（疑似缺陷）</text>
<text x="52" y="384" font-size="11.5" fill="#1f1e1c">删除好友会软删除双方申请记录，可重新申请</text>
</g>

<g>
